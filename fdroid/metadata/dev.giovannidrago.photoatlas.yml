# DRAFT metadata for fdroiddata. Do not submit before validating with `fdroid build`.
#
# Flutter 3.47 applies its own ABI version codes to split APKs
# (ABI_VERSION * 1000 + build number, for example 2100 for arm64-v8a with build 100).
# The VercodeOperation values below follow the older base*10+ABI scheme; recompute them
# (or use force-version-code-ignoring-abi) and verify with fdroid lint/rewritemeta/build,
# then replace the TODO placeholders before opening a merge request.

Categories:
  - Multimedia
License: GPL-3.0-only
AuthorName: Giovanni Drago
SourceCode: https://github.com/GiovanniDrago/photo-atlas-app
IssueTracker: https://github.com/GiovanniDrago/photo-atlas-app/issues
Changelog: https://github.com/GiovanniDrago/photo-atlas-app/releases

AutoName: Photo Atlas

RepoType: git
Repo: https://github.com/GiovanniDrago/photo-atlas-app.git

Builds:
  - versionName: 0.1.0
    versionCode: 1001
    commit: TODO-RELEASE-COMMIT
    output: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
    binary:
      https://github.com/GiovanniDrago/photo-atlas-app/releases/download/v%v/app-armeabi-v7a-release.apk
    srclibs:
      - flutter@stable
    rm:
      - ios
      - macos
      - windows
    prebuild:
      - "flutterVersion=$(sed -n -E \"s/.*flutter-version: '(.*)'/\\1/p\" .github/workflows/android-release-build.yml)"
      - '[[ $flutterVersion ]]'
      - git -C $$flutter$$ checkout -f $flutterVersion
      - export SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get
    scandelete:
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release --split-per-abi --target-platform="android-arm" --build-name $$VERSION$$ --build-number $(( $$VERCODE$$ / 10 ))

