name: Linux Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libsecret-1-dev libjsoncpp-dev

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter build linux --release

      - name: Package bundle
        run: |
          mkdir -p dist
          tar czf "dist/photoatlas-linux-x86_64.tar.gz" -C build/linux/*/release .

      - uses: actions/upload-artifact@v4
        with:
          name: photoatlas-linux-x86_64
          path: dist/photoatlas-linux-x86_64.tar.gz

      - name: Attach to GitHub release
        if: ${{ github.ref_type == 'tag' }}
        uses: softprops/action-gh-release@v2
        with:
          files: dist/photoatlas-linux-x86_64.tar.gz
