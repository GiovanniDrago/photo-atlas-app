name: 'Native Android build'

on:
  workflow_dispatch:
  push:
    branches: ['android-native']
    tags: ['native-v*']

permissions:
  contents: 'write'

jobs:
  build:
    name: 'Build Photo Atlas Studio'
    runs-on: 'ubuntu-latest'
    defaults:
      run:
        working-directory: 'android-native'
    steps:
      - name: 'Checkout'
        uses: 'actions/checkout@v4'

      - name: 'Set up JDK'
        uses: 'actions/setup-java@v4'
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: 'Decode keystore'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: printf '%s' "$KEYSTORE_BASE64" | base64 --decode > release.keystore

      - name: 'Test and build'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: './gradlew test assembleDebug assembleRelease'

      - name: 'Rename and checksum'
        id: package
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          NAME="PhotoAtlasStudio-${VERSION}-${GITHUB_RUN_NUMBER}"
          mv app/build/outputs/apk/release/app-release.apk "app/build/outputs/apk/release/${NAME}.apk"
          sha256sum "app/build/outputs/apk/release/${NAME}.apk" | tee "app/build/outputs/apk/release/${NAME}.apk.sha256"
          echo "NAME=${NAME}" >> "$GITHUB_OUTPUT"

      - name: 'Upload artifact'
        uses: 'actions/upload-artifact@v4'
        with:
          name: '${{ steps.package.outputs.NAME }}'
          path: |
            android-native/app/build/outputs/apk/release/*.apk
            android-native/app/build/outputs/apk/release/*.sha256
          retention-days: 30

      - name: 'Create release'
        if: startsWith(github.ref, 'refs/tags/native-v')
        uses: 'softprops/action-gh-release@v2'
        with:
          tag_name: '${{ github.ref_name }}'
          name: 'Photo Atlas Studio ${{ github.ref_name }}'
          body: |
            Native Android rewrite of Photo Atlas (Kotlin + Jetpack Compose).

            Application id: `dev.giovannidrago.photoatlas.studio` — it installs next to the
            Flutter build, so the two apps can be compared side by side.
          files: |
            android-native/app/build/outputs/apk/release/*.apk
            android-native/app/build/outputs/apk/release/*.sha256
