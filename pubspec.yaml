name: photoatlas
description: "Photo Atlas: aggregate and organize images and videos by time and space."
publish_to: 'none'
version: 0.1.0+100

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  http: ^1.6.0
  shared_preferences: ^2.5.5
  intl: any
  file_picker: ^12.3.0
  path_provider: ^2.1.6
  exif: ^3.3.0
  url_launcher: ^6.3.2
  cached_network_image: ^4.0.0
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/geo/
